name: Verify EasySolve
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easysolve
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: easysolve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easysolve"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://easysolve:ci-disposable-password@localhost:5432/easysolve
      APP_URL: http://localhost:3000
      AI_PROVIDER: deepseek
      # Browser AI responses are intercepted; never use a real provider key in CI.
      DEEPSEEK_API_KEY: ci-mocked-provider-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: docker build -t easysolve-sandbox:local sandbox
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          # Browser flows sign in many times from one client; production limits
          # stay covered by the integration tests.
          TRUST_PROXY: "true"
          RESEND_API_KEY: ci-stubbed-resend-key
          NODE_OPTIONS: --import ./tests/browser/stub-resend.mjs
          AUTH_IP_LIMIT_PER_MINUTE: "1000"
          AUTH_ACCOUNT_LIMIT_PER_15_MINUTES: "1000"
          RECOVERY_IP_LIMIT_PER_MINUTE: "1000"
          RECOVERY_ACCOUNT_LIMIT_PER_HOUR: "1000"
      - run: npm run build
      - run: docker build -f Dockerfile.worker -t easysolve-worker:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
